name: Deploy Laravel Admin Project

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Chỉ clone commit mới nhất để tiết kiệm thời gian tải git
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Cài đặt PHP & Tự động CACHE Composer dependencies
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Đổi thành 8.1 hoặc 8.3 nếu trùng khớp với composer.json của bạn
          coverage: none
        env:
          phpextensions: mbstring, pdo, pdo_mysql, bcmath, ctype, json, openssl

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      # 3. Cài đặt Node.js & Tự động CACHE NPM packages (Tối ưu cho Vue 3/Vite)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      # 4. Cache cho build tĩnh của Vite
      - name: Cache Vite Build
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}

      - name: Build Assets with Vite
        run: npm run build

      # 5. Build Docker Image (Tận dụng Docker Layer Cache)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image with Layer Cache
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Đổi thành true nếu bạn push lên Docker Hub / GHCR
          tags: hdv179/admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Lệnh Deploy lên Server (Ví dụ qua SSH)
      - name: Deploy to Server via SSH
        # Chỉ chạy nếu bạn đã cấu hình Secrets SSH trong GitHub Settings
        if: secrets.SERVER_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /path/to/your/app
            git pull origin main
            docker-compose down
            docker-compose up -d --build
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
