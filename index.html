<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Builder & Manager - HDV179 WAP</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
    <style>
        /* Tối ưu hóa khung viền chống tràn chiều ngang cho WAP */
        *, *:before, *:after {
            box-sizing: border-box !important;
        }

        /* Khóa độ rộng chuẩn WAP, căn giữa màn hình */
        body {
            margin: 0 auto;
            padding: 0;
            width: 100%;
            max-width: 480px; /* Giới hạn chiều ngang tối đa chuẩn WAP */
            background-color: #f4f4f4; /* Nền xám nhẹ ngoài khung WAP nếu xem trên PC */
            overflow-x: hidden;
        }

        .wap-wrapper {
            background-color: #ffffff;
            padding: 4px;
            width: 100%;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .wap-card, form {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        .form-control, textarea.form-control {
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
            resize: vertical; /* Chỉ kéo dãn dọc */
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .upload-box, .file-row {
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="header"></div>

    <!-- Bọc toàn bộ nội dung trong wrapper để khóa chiều ngang -->
    <div class="wap-wrapper">
        <!-- CẤU HÌNH API -->
        <div class="title-head">⚙️ CẤU HÌNH GITHUB API</div>
        <div class="wap-card">
            <div class="form-group">
                <label>GitHub Personal Access Token:</label>
                <input type="password" id="gh-token" class="form-control" placeholder="ghp_xxxxxxxxxxxx">
            </div>
            <div class="form-group">
                <label>Đường Dẫn Repo (username/repository):</label>
                <input type="text" id="gh-repo" class="form-control" placeholder="username/hdv179-wap">
            </div>
            <button type="button" class="btn btn-secondary btn-block" onclick="saveConfig()">💾 Lưu Cấu Hình</button>
        </div>

        <!-- TÌM BÀI VIẾT ĐỂ SỬA HOẶC XÓA -->
        <div class="title-head">🔍 QUẢN LÝ / BÀI VIẾT ĐÃ ĐĂNG</div>
        <div class="wap-card">
            <div class="form-group">
                <label>Nhập Mã ID Bài Viết (ví dụ: avatar-250):</label>
                <div style="display: flex; gap: 3px;">
                    <input type="text" id="load-item-id" class="form-control" placeholder="avatar-250" style="flex:1;">
                    <button type="button" class="btn" onclick="loadItemData()">📥 Tải Dữ Liệu</button>
                </div>
            </div>
            <div style="font-size: 11px; color: #666; margin-top: 2px;">(Tải dữ liệu bài viết cũ lên form để chỉnh sửa hoặc xóa)</div>
        </div>

        <!-- FORM TẠO / SỬA BÀI VIẾT -->
        <form id="builder-form">
            <div class="title-head">THÔNG TIN BÀI VIẾT</div>
            <div class="wap-card">
                <div class="form-group">
                    <label>Chuyên Mục Target:</label>
                    <select id="game-category" class="form-control">
                        <option value="gameloft">Game Gameloft</option>
                        <option value="teamobi">Game TeaMobi & Mod</option>
                        <option value="online">Game Online</option>
                        <option value="offline">Game Offline</option>
                        <option value="ungdung">Ứng Dụng</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mã Định Danh (ID bài viết):</label>
                    <input type="text" id="game-id" class="form-control" placeholder="avatar-250" required>
                </div>
                <div class="form-group">
                    <label>Tiêu Đề Bài Viết / Tên Game:</label>
                    <input type="text" id="game-title" class="form-control" placeholder="Avatar 250 Auto Farm" required>
                </div>
                <div class="form-group">
                    <label>Nhà Phát Triển / Tác Giả:</label>
                    <input type="text" id="game-vendor" class="form-control" placeholder="TeaMobi">
                </div>
                <div class="form-group">
                    <label>Màn Hình & Phiên Bản:</label>
                    <div style="display: flex; gap: 3px;">
                        <input type="text" id="game-screen" class="form-control" placeholder="240x320" value="Multi screen" style="flex:1;">
                        <input type="text" id="game-version" class="form-control" placeholder="v2.5.0" value="1.0" style="flex:1;">
                    </div>
                </div>
            </div>

            <div class="title-head">NỘI DUNG & HÌNH ẢNH</div>
            <div class="wap-card">
                <div id="blocks-container" style="width: 100%;"></div>
                <div style="display: flex; gap: 3px; margin-top: 4px;">
                    <button type="button" class="btn btn-secondary" style="flex:1;" onclick="addContentBlock('text')">+ Đoạn Văn</button>
                    <button type="button" class="btn btn-secondary" style="flex:1;" onclick="addContentBlock('image')">+ Ảnh Minh Họa</button>
                </div>
            </div>

            <div class="title-head">KHỐI FILE TẢI VỀ</div>
            <div class="wap-card">
                <div id="dl-groups-container" style="width: 100%;"></div>
                <button type="button" class="btn btn-secondary btn-block" style="margin-top:4px;" onclick="addDownloadGroup()">+ Thêm Khối Tải Về</button>
            </div>

            <div style="display: flex; gap: 3px; margin: 8px 0;">
                <button type="submit" class="btn btn-block" style="flex:2; padding: 6px;">🚀 CẬP NHẬT / ĐĂNG BÀI</button>
                <button type="button" class="btn btn-danger btn-block" style="flex:1; padding: 6px;" onclick="deleteItem()">🗑️ XÓA BÀI</button>
            </div>
        </form>

        <div id="status-msg"></div>
    </div>

    <div id="footer"></div>

    <script>
        window.onload = function() {
            if (localStorage.getItem('hdv179_gh_token')) document.getElementById('gh-token').value = localStorage.getItem('hdv179_gh_token');
            if (localStorage.getItem('hdv179_gh_repo')) document.getElementById('gh-repo').value = localStorage.getItem('hdv179_gh_repo');
            resetForm();
        };

        function saveConfig() {
            localStorage.setItem('hdv179_gh_token', document.getElementById('gh-token').value.trim());
            localStorage.setItem('hdv179_gh_repo', document.getElementById('gh-repo').value.trim());
            alert('Đã lưu cấu hình!');
        }

        function resetForm() {
            document.getElementById('blocks-container').innerHTML = '';
            document.getElementById('dl-groups-container').innerHTML = '';
            addContentBlock('text');
            addDownloadGroup();
        }

        function addContentBlock(type, val = '', caption = '') {
            const container = document.getElementById('blocks-container');
            const div = document.createElement('div');
            div.className = 'wap-card content-block-item';
            div.style.margin = '4px 0';
            div.style.padding = '4px';
            div.dataset.type = type;

            if (type === 'text') {
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
                        <strong>📝 Đoạn Văn</strong>
                        <button type="button" class="btn btn-danger" onclick="this.closest('.content-block-item').remove()">Xóa</button>
                    </div>
                    <textarea class="form-control block-val" rows="3" style="width:100%; box-sizing:border-box; resize:vertical;">${val}</textarea>
                `;
            } else if (type === 'image') {
                const uid = 'img-' + Date.now() + Math.random().toString(36).substr(2, 3);
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
                        <strong>🖼️ Ảnh Minh Họa</strong>
                        <button type="button" class="btn btn-danger" onclick="this.closest('.content-block-item').remove()">Xóa</button>
                    </div>
                    <div class="upload-box" style="display:flex; gap:2px;">
                        <input type="text" class="form-control block-val" id="${uid}-input" placeholder="assets/images/..." value="${val}" style="flex:1;">
                        <input type="file" id="${uid}-file" class="file-input-hidden" accept="image/*" style="display:none;" onchange="triggerUpload('${uid}', 'assets/images', true)">
                        <button type="button" class="btn btn-upload" onclick="document.getElementById('${uid}-file').click()">📤 Upload</button>
                    </div>
                    <input type="text" class="form-control block-caption" placeholder="Chú thích ảnh" value="${caption}" style="margin-top:2px;">
                `;
            }
            container.appendChild(div);
        }

        let groupCounter = 0;
        function addDownloadGroup(title = '', files = []) {
            groupCounter++;
            const container = document.getElementById('dl-groups-container');
            const groupDiv = document.createElement('div');
            groupDiv.className = 'wap-card dl-group-item';
            groupDiv.style.margin = '4px 0';
            groupDiv.style.padding = '4px';
            const gId = `dl-files-${groupCounter}`;

            groupDiv.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
                    <strong style="color:var(--primary-main);">Khối File #${groupCounter}</strong>
                    <button type="button" class="btn btn-danger" onclick="this.closest('.dl-group-item').remove()">Xóa Khối</button>
                </div>
                <input type="text" class="form-control group-title" placeholder="Tiêu đề khối" value="${title}" style="margin-bottom:3px;">
                <div id="${gId}"></div>
                <button type="button" class="btn btn-secondary" style="margin-top:2px; width:100%;" onclick="addFileRow('${gId}')">+ Thêm File</button>
            `;
            container.appendChild(groupDiv);

            if (files && files.length > 0) {
                files.forEach(f => addFileRow(gId, f.label, f.url, f.screen, f.os));
            } else {
                addFileRow(gId);
            }
        }

        function addFileRow(groupId, label = '', url = '', screenVal = 'Multi', osVal = 's40') {
            const container = document.getElementById(groupId);
            const row = document.createElement('div');
            const uid = 'file-' + Date.now() + Math.random().toString(36).substr(2, 3);
            row.className = 'file-row';
            row.style.marginBottom = '6px';
            row.style.borderBottom = '1px dashed #ccc';
            row.style.paddingBottom = '4px';

            row.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:2px;">
                    <div style="display:flex; gap:2px;">
                        <input type="text" class="form-control file-label" placeholder="Tên hiển thị (.JAR)" value="${label}" style="flex:1;">
                        <input type="text" class="form-control custom-file-name" id="${uid}-custom" placeholder="Tên file tùy chọn" style="flex:1;">
                    </div>
                    <div style="display:flex; gap:2px; margin-top:2px;">
                        <select id="${uid}-screen" class="form-control file-screen" style="flex:1;">
                            <option value="Multi" ${screenVal==='Multi'?'selected':''}>Multi</option>
                            <option value="240x320" ${screenVal==='240x320'?'selected':''}>240x320</option>
                            <option value="320x240" ${screenVal==='320x240'?'selected':''}>320x240</option>
                            <option value="128x160" ${screenVal==='128x160'?'selected':''}>128x160</option>
                            <option value="176x208" ${screenVal==='176x208'?'selected':''}>176x208</option>
                            <option value="176x220" ${screenVal==='176x220'?'selected':''}>176x220</option>
                            <option value="360x640" ${screenVal==='360x640'?'selected':''}>360x640</option>
                        </select>
                        <select id="${uid}-os" class="form-control file-os" style="flex:1;">
                            <option value="s40" ${osVal==='s40'?'selected':''}>s40</option>
                            <option value="s60" ${osVal==='s60'?'selected':''}>s60</option>
                            <option value="android" ${osVal==='android'?'selected':''}>Android</option>
                            <option value="common" ${osVal==='common'?'selected':''}>Chung</option>
                        </select>
                    </div>
                    <div class="upload-box" style="display:flex; gap:2px; margin-top:2px;">
                        <input type="text" class="form-control file-url" id="${uid}-input" placeholder="assets/files/..." value="${url}" style="flex:1;">
                        <input type="file" id="${uid}-file" class="file-input-hidden" style="display:none;" onchange="triggerUpload('${uid}', 'assets/files', false)">
                        <button type="button" class="btn btn-upload" onclick="document.getElementById('${uid}-file').click()">📤 Upload</button>
                        <button type="button" class="btn btn-danger" onclick="this.closest('.file-row').remove()">X</button>
                    </div>
                </div>
            `;
            container.appendChild(row);
        }

        function triggerUpload(uid, folderPath, isImage = false) {
            const fileInput = document.getElementById(`${uid}-file`);
            const targetInput = document.getElementById(`${uid}-input`);
            const file = fileInput.files[0];
            if (!file) return;

            let baseName = '';
            if (isImage) {
                const gameId = document.getElementById('game-id').value.trim() || 'image';
                baseName = `${gameId}_${Date.now()}`;
            } else {
                const customName = document.getElementById(`${uid}-custom`).value.trim();
                const gameId = document.getElementById('game-id').value.trim();
                const prefixName = customName || gameId || 'file';

                const screen = document.getElementById(`${uid}-screen`).value;
                const os = document.getElementById(`${uid}-os`).value;
                const timeStamp = Date.now();

                baseName = `${prefixName}_${screen}_${os}_${timeStamp}`;
            }

            uploadToGitHub(file, folderPath, baseName, targetInput);
        }

        function showStatus(text, type) {
            const msg = document.getElementById('status-msg');
            msg.innerText = text;
            msg.className = `status-msg ${type}`;
        }

        async function loadItemData() {
            const itemId = document.getElementById('load-item-id').value.trim();
            if (!itemId) return alert('Vui lòng nhập Mã ID bài viết!');

            showStatus(`⏳ Đang tải bài viết [${itemId}] từ GitHub...`, 'success');

            try {
                const res = await fetch(`data/items/${itemId}.json?v=${Date.now()}`);
                if (!res.ok) throw new Error('Không tìm thấy bài viết trên hệ thống!');
                
                const data = await res.json();

                document.getElementById('game-id').value = data.id || '';
                document.getElementById('game-category').value = data.category || 'gameloft';
                document.getElementById('game-title').value = data.title || '';
                document.getElementById('game-vendor').value = data.vendor || '';
                document.getElementById('game-screen').value = data.screen || 'Multi screen';
                document.getElementById('game-version').value = data.version || '1.0';

                document.getElementById('blocks-container').innerHTML = '';
                if (data.blocks && data.blocks.length > 0) {
                    data.blocks.forEach(b => {
                        addContentBlock(b.type, b.value, b.caption || '');
                    });
                } else {
                    addContentBlock('text');
                }

                document.getElementById('dl-groups-container').innerHTML = '';
                groupCounter = 0;
                if (data.downloads && data.downloads.length > 0) {
                    data.downloads.forEach(g => {
                        addDownloadGroup(g.groupTitle, g.files);
                    });
                } else {
                    addDownloadGroup();
                }

                showStatus(`✅ Đã tải xong bài viết [${itemId}]. Bạn có thể chỉnh sửa ngay!`, 'success');
            } catch (err) {
                showStatus(`❌ Lỗi: ${err.message}`, 'error');
            }
        }

        document.getElementById('builder-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const token = document.getElementById('gh-token').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const category = document.getElementById('game-category').value;
            const itemId = document.getElementById('game-id').value.trim();
            const title = document.getElementById('game-title').value.trim();

            if (!token || !repo) return showStatus('Thiếu Token hoặc Repo!', 'error');

            showStatus('⏳ Đang cập nhật bài viết lên GitHub...', 'success');

            const blocks = [];
            let thumbUrl = '';
            document.querySelectorAll('.content-block-item').forEach(el => {
                const type = el.dataset.type;
                const val = el.querySelector('.block-val').value.trim();
                if (val !== '') {
                    if (type === 'text') blocks.push({ type: 'text', value: val });
                    if (type === 'image') {
                        blocks.push({ type: 'image', value: val, caption: el.querySelector('.block-caption').value.trim() });
                        if (!thumbUrl) thumbUrl = val;
                    }
                }
            });

            const downloads = [];
            document.querySelectorAll('.dl-group-item').forEach(groupEl => {
                const groupTitle = groupEl.querySelector('.group-title').value.trim();
                const files = [];
                groupEl.querySelectorAll('.file-row').forEach(fRow => {
                    const l = fRow.querySelector('.file-label').value.trim();
                    const u = fRow.querySelector('.file-url').value.trim();
                    const screen = fRow.querySelector('.file-screen') ? fRow.querySelector('.file-screen').value : 'Multi';
                    const os = fRow.querySelector('.file-os') ? fRow.querySelector('.file-os').value : 's40';
                    
                    if (l !== '' && u !== '') {
                        files.push({ label: l, url: u, screen: screen, os: os });
                    }
                });
                if (files.length > 0) downloads.push({ groupTitle: groupTitle || 'DOWNLOAD', files: files });
            });

            const fullDetailObj = {
                id: itemId, title: title, vendor: document.getElementById('game-vendor').value.trim(),
                category: category, screen: document.getElementById('game-screen').value.trim(),
                version: document.getElementById('game-version').value.trim(),
                date: new Date().toLocaleDateString('vi-VN'), blocks: blocks, downloads: downloads
            };

            const indexSummaryObj = {
                id: itemId, title: title, vendor: fullDetailObj.vendor,
                screen: fullDetailObj.screen, thumb: thumbUrl
            };

            try {
                const itemPath = `data/items/${itemId}.json`;
                const itemUrl = `https://api.github.com/repos/${repo}/contents/${itemPath}`;
                let itemSha = null;
                const itemCheck = await fetch(itemUrl, { headers: { 'Authorization': `token ${token}` } });
                if (itemCheck.ok) { const d = await itemCheck.json(); itemSha = d.sha; }

                await fetch(itemUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `WAP Detail Update: ${itemId}`,
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(fullDetailObj, null, 2)))),
                        sha: itemSha
                    })
                });

                const indexPath = `data/index/${category}.json`;
                const indexUrl = `https://api.github.com/repos/${repo}/contents/${indexPath}`;
                let indexItems = [];
                let indexSha = null;
                const indexCheck = await fetch(indexUrl, { headers: { 'Authorization': `token ${token}` } });
                if (indexCheck.ok) {
                    const d = await indexCheck.json();
                    indexSha = d.sha;
                    indexItems = JSON.parse(decodeURIComponent(escape(atob(d.content))));
                }

                indexItems = indexItems.filter(i => i.id !== itemId);
                indexItems.unshift(indexSummaryObj);

                await fetch(indexUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `WAP Index Update: ${category}`,
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(indexItems, null, 2)))),
                        sha: indexSha
                    })
                });

                showStatus('🎉 Đã cập nhật thành công bài viết và chỉ mục!', 'success');
            } catch (err) {
                showStatus(`❌ Thất bại: ${err.message}`, 'error');
            }
        });

        async function deleteItem() {
            const token = document.getElementById('gh-token').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const itemId = document.getElementById('game-id').value.trim();
            const category = document.getElementById('game-category').value;

            if (!itemId) return alert('Vui lòng nhập Mã ID bài viết muốn xóa!');
            if (!token || !repo) return alert('Thiếu Token hoặc Repo!');

            if (!confirm(`⚠️ Bạn có chắc chắn muốn XÓA VĨNH VIỄN bài viết [${itemId}] khỏi hệ thống?`)) return;

            showStatus(`⏳ Đang tiến hành xóa bài viết [${itemId}]...`, 'error');

            try {
                const itemPath = `data/items/${itemId}.json`;
                const itemUrl = `https://api.github.com/repos/${repo}/contents/${itemPath}`;
                const itemCheck = await fetch(itemUrl, { headers: { 'Authorization': `token ${token}` } });
                
                if (itemCheck.ok) {
                    const itemData = await itemCheck.json();
                    await fetch(itemUrl, {
                        method: 'DELETE',
                        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: `Delete item: ${itemId}`,
                            sha: itemData.sha
                        })
                    });
                }

                const indexPath = `data/index/${category}.json`;
                const indexUrl = `https://api.github.com/repos/${repo}/contents/${indexPath}`;
                const indexCheck = await fetch(indexUrl, { headers: { 'Authorization': `token ${token}` } });
                
                if (indexCheck.ok) {
                    const indexData = await indexCheck.json();
                    let indexItems = JSON.parse(decodeURIComponent(escape(atob(indexData.content))));
                    
                    indexItems = indexItems.filter(i => i.id !== itemId);

                    await fetch(indexUrl, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: `Remove ${itemId} from ${category} index`,
                            content: btoa(unescape(encodeURIComponent(JSON.stringify(indexItems, null, 2)))),
                            sha: indexData.sha
                        })
                    });
                }

                showStatus(`🗑️ Đã xóa hoàn toàn bài viết [${itemId}]!`, 'success');
                resetForm();
                document.getElementById('game-id').value = '';
                document.getElementById('game-title').value = '';
            } catch (err) {
                showStatus(`❌ Lỗi khi xóa: ${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
