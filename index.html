<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <title>Admin WAP Builder</title>
    <link rel="stylesheet" href="style.css">
    <script src="admin.js" defer></script>
</head>
<body>
    <div class="wap-container">
        <div class="wap-wrapper">
            
            <div class="title-head" style="text-align: center;">
            📱 HDV179 ADMIN 📱
            </div>
            <!-- CẤU HÌNH GITHUB -->
            <div class="title-head">⚙️ CẤU HÌNH GITHUB</div>
            <div class="wap-card">
                <div class="form-group"><label>Access Token:</label><input type="password" id="gh-token" class="form-control" placeholder="ghp_xxx"></div>
                <div class="form-group"><label>Repository (user/repo):</label><input type="text" id="gh-repo" class="form-control" placeholder="hdv179/wap"></div>
                <button type="button" id="btn-save-config" class="btn btn-secondary btn-block">💾 Lưu Cấu Hình</button>
            </div>

            <!-- DANH MỤC & DANH SÁCH BÀI VIẾT -->
            <div class="title-head">🔍 QUẢN LÝ BÀI VIẾT THEO DANH MỤC</div>
            <div class="wap-card">
                <div class="form-group">
                    <label>Chọn Danh Mục:</label>
                    <select id="search-category" class="form-control">
                        <option value="gameloft">Game Gameloft</option>
                        <option value="teamobi">Game TeaMobi & Mod</option>
                        <option value="gameonline">Game Online</option>
                        <option value="gameoffline">Game Offline</option>
                        <option value="gameviethoa">Game Việt Hóa</option>
                        <option value="trinhduyet">Trình Duyệt</option>
                        <option value="ungdung">Ứng Dụng</option>
                        <option value="hinhnen">Hình Nền</option>
                        <option value="nhacchuong">Nhạc Chuông</option>
                        <option value="chude">Chủ Đề (Theme)</option>
                        <option value="doctruyen">Đọc Truyện</option>
                        <option value="thuthuat">Thủ Thuật</option>
                    </select>
                </div>
                <div style="margin-top: 6px; font-weight: bold; font-size: 11px; color: #333;">Danh Sách Bài Viết Trong Mục:</div>
                <div id="category-items-list" style="max-height: 180px; overflow-y: auto; font-size: 11px; border: 1px solid #eee; padding: 4px; background: #fafafa; margin-top: 2px; border-radius: 3px;"></div>
            </div>

            <!-- FORM BÀI VIẾT -->
            <form id="builder-form" style="margin-top: 10px;">
                <div class="title-head">📝 THÔNG TIN BÀI VIẾT</div>
                <div class="wap-card">
                    <div class="form-group">
                        <label>Danh Mục Đăng:</label>
                        <select id="game-category" class="form-control">
                            <option value="gameloft">Game Gameloft</option>
                            <option value="teamobi">Game TeaMobi & Mod</option>
                            <option value="gameonline">Game Online</option>
                            <option value="gameoffline">Game Offline</option>
                            <option value="gameviethoa">Game Việt Hóa</option>
                            <option value="trinhduyet">Trình Duyệt</option>
                            <option value="ungdung">Ứng Dụng</option>
                            <option value="hinhnen">Hình Nền</option>
                            <option value="nhacchuong">Nhạc Chuông</option>
                            <option value="chude">Chủ Đề (Theme)</option>
                            <option value="doctruyen">Đọc Truyện</option>
                            <option value="thuthuat">Thủ Thuật</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Mã ID Bài Viết:</label><input type="text" id="game-id" class="form-control" required></div>
                    <div class="form-group"><label>Tiêu Đề / Tên Game:</label><input type="text" id="game-title" class="form-control" required></div>
                    <div class="form-group"><label>Nhà Phát Triển / Tác Giả:</label><input type="text" id="game-vendor" class="form-control"></div>
                    <div class="form-group">
                        <label>Màn Hình & Phiên Bản:</label>
                        <div style="display:flex; gap:3px;">
                            <select id="game-screen" class="form-control" style="flex:1;">
                                <option value="Multi Screen">Multi Screen</option>
                                <option value="128x128">128x128</option>
                                <option value="128x160">128x160</option>
                                <option value="176x208">176x208</option>
                                <option value="176x220">176x220</option>
                                <option value="240x320">240x320</option>
                                <option value="240x400">240x320</option>
                                <option value="320x240">320x240</option>
                                <option value="360x640">360x640</option>
                            </select>
                            <input type="text" id="game-version" class="form-control" value="1.0" style="flex:1;">
                        </div>
                    </div>
                </div>

                <div class="title-head">🖼️ NỘI DUNG & HÌNH ẢNH</div>
                <div class="wap-card">
                    <div id="blocks-container"></div>
                    <div style="display:flex; gap:3px; margin-top:4px;">
                        <button type="button" id="btn-add-text" class="btn btn-secondary" style="flex:1;">+ Đoạn Văn</button>
                        <button type="button" id="btn-add-image" class="btn btn-secondary" style="flex:1;">+ Ảnh Minh Họa</button>
                    </div>
                </div>

                <div class="title-head">📥 KHỐI FILE TẢI VỀ</div>
                <div class="wap-card">
                    <div id="dl-groups-container" style="width: 100%;"></div>
                    <button type="button" id="btn-add-group" class="btn btn-secondary btn-block" style="margin-top:4px;">+ Thêm Khối File</button>
                </div>

                <div style="display:flex; gap:3px; margin:8px 0;">
                    <button type="submit" class="btn btn-block" style="flex:2;">🚀 LƯU / ĐĂNG BÀI</button>
                    <button type="button" id="btn-new-item" class="btn btn-secondary btn-block" style="flex:1;">➕ Tạo Bài Mới</button>
                    <button type="button" id="btn-delete-item" class="btn btn-danger btn-block" style="flex:1;">🗑️ XÓA BÀI</button>
                </div>
            </form>

            <div id="status-msg"></div>
            
            <div class="footer">&copy; 2026 HDV179 WAP - Kho Game &amp; Ứng dụng Java Mobile</div>
            
        </div>
    </div>
</body>
</html>
